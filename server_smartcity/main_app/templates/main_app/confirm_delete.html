{% extends 'base.html' %}

{% block title %}Hapus Laporan{% endblock %}

{% block content %}
<div class="page-shell">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/reports/">Reports</a></li>
        <li class="breadcrumb-item active">Delete</li>
      </ol>
    </nav>

    <div class="d-flex justify-content-center align-items-center" style="min-height:60vh;">
        <div class="card shadow p-4 text-center" style="width:420px;">
            <div class="mb-3">
                <div class="mx-auto d-flex justify-content-center align-items-center"
                style="width:80px;height:80px;border:2px solid #ef6a7b;border-radius:50%;font-size:40px;color:#ef6a7b;">
                    <i class="bi bi-exclamation-lg"></i>
                </div>
            </div>

            <h3 class="mb-3">Are you sure?</h3>

            <p class="text-muted">
                Do you really want to delete this report?<br>
                This process cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="mt-4 d-flex justify-content-center gap-2">
                    <a href="{% url 'report_list' %}" class="btn btn-secondary"><i class="bi bi-arrow-left-circle-fill"></i>Cancel</a>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash3-fill"></i>Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
