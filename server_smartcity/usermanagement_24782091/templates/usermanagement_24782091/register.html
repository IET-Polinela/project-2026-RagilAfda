{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card p-4">
            <h2 class="section-title">Register</h2>
            <p class="section-subtitle">Buat akun baru untuk mengakses layanan pelaporan kota.</p>

            <form method="POST" class="mt-3">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-success"><i class="bi bi-person-plus-fill"></i>Register</button>
                    <a href="{% url 'login' %}" class="btn btn-secondary"><i class="bi bi-arrow-left-circle-fill"></i>Kembali ke Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
